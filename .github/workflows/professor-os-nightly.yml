name: Professor OS Nightly Lecture

on:
  workflow_dispatch:
  schedule:
    - cron: '20 20 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write

concurrency:
  group: professor-os-nightly
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      USE_GEMINI_IMAGES: ${{ vars.USE_GEMINI_IMAGES || 'true' }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-lite-image' }}

      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      GITHUB_BRANCH: main

      PUBLIC_LESSON_BASE_URL: ${{ vars.PROFESSOR_OS_PUBLIC_URL }}

      AUTO_PUBLISH: 'true'
      AUTO_SYNC_SOURCE: 'false'
      DASHBOARD_SCHEDULE: 'false'
      AUTO_BOOTSTRAP_GENERATION: 'false'
      ENABLE_MANUAL_RUN: 'false'

      PREMIUM_QUALITY_MIN_SCORE: '88'
      PREMIUM_QUALITY_MIN_DIMENSION: '80'
      PREMIUM_QUALITY_REWRITE_ROUNDS: '2'
      POST_MEDIA_REPAIR_ROUNDS: '3'
      TECHNICAL_QUALITY_REPAIR_ROUNDS: '3'
      REQUIRE_AI_QUALITY_REVIEW: 'true'

      # External licensed photos/videos are enrichment, not a hard dependency.
      # Gemini hero + inline teaching visuals remain mandatory and gated.
      ENABLE_EXTERNAL_MEDIA: 'true'
      REQUIRE_RECOMMENDED_MEDIA: 'false'

      # Every published lesson receives an offline-downloadable podcast.
      PODCAST_ENABLED: 'true'
      PODCAST_REQUIRED: 'true'
      PODCAST_TTS_MODEL: 'gpt-4o-mini-tts'
      PODCAST_VOICE: 'alloy'
      PODCAST_SCRIPT_MAX_WORDS: '1000'
      PODCAST_BACKFILL_MAX: '2'

      TIMEZONE: Asia/Kolkata
      NIGHTLY_RELEASE_HOUR: '21'
      NIGHTLY_RELEASE_MINUTE: '0'

      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'

      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}

      GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
      GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Professor OS in Python 3.7
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e OPENAI_API_KEY \
            -e OPENAI_MODEL \
            -e GEMINI_API_KEY \
            -e USE_GEMINI_IMAGES \
            -e GEMINI_IMAGE_MODEL \
            -e GITHUB_TOKEN \
            -e GITHUB_OWNER \
            -e GITHUB_REPO \
            -e GITHUB_BRANCH \
            -e PUBLIC_LESSON_BASE_URL \
            -e AUTO_PUBLISH \
            -e AUTO_SYNC_SOURCE \
            -e DASHBOARD_SCHEDULE \
            -e AUTO_BOOTSTRAP_GENERATION \
            -e ENABLE_MANUAL_RUN \
            -e PREMIUM_QUALITY_MIN_SCORE \
            -e PREMIUM_QUALITY_MIN_DIMENSION \
            -e PREMIUM_QUALITY_REWRITE_ROUNDS \
            -e POST_MEDIA_REPAIR_ROUNDS \
            -e TECHNICAL_QUALITY_REPAIR_ROUNDS \
            -e REQUIRE_AI_QUALITY_REVIEW \
            -e ENABLE_EXTERNAL_MEDIA \
            -e REQUIRE_RECOMMENDED_MEDIA \
            -e PODCAST_ENABLED \
            -e PODCAST_REQUIRED \
            -e PODCAST_TTS_MODEL \
            -e PODCAST_VOICE \
            -e PODCAST_SCRIPT_MAX_WORDS \
            -e PODCAST_BACKFILL_MAX \
            -e TIMEZONE \
            -e NIGHTLY_RELEASE_HOUR \
            -e NIGHTLY_RELEASE_MINUTE \
            -e MPLBACKEND \
            -e PYTHONUNBUFFERED \
            -e LINKEDIN_ACCESS_TOKEN \
            -e LINKEDIN_AUTHOR_URN \
            -e GOOGLE_CSE_API_KEY \
            -e GOOGLE_CSE_ID \
            -e YOUTUBE_API_KEY \
            python:3.7-slim \
            sh -lc '
              set -eu

              python -m pip install --upgrade "pip<24.1"
              python -m pip install -r requirements.txt

              echo "Running Professor OS tests..."
              python -m pytest -q

              echo "Checking Python compilation..."
              python -m compileall -q teacher_agent tests

              echo "Backfilling missing Professor OS podcasts..."
              python -m teacher_agent.podcast_backfill

              echo "All static checks passed. Generating next lesson..."
              python -m teacher_agent.main --once
            '

      - name: Restore workspace ownership
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Upload failed Professor OS diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: professor-os-failed-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            preview/**/FAILED*.md
            preview/**/FAILED*.json
            preview/**/QUALITY_REPORT.json
            preview/**/VISUAL_PLAN.json
            preview/**/hero.png
            preview/**/diagram.png
            preview/**/inline_*.png
            preview/**/PODCAST.json
            preview/**/podcast_transcript.txt
            preview/**/podcast.mp3
            teacher_agent.log
            .robotics_teacher_runtime.json

      - name: Persist generated lesson state
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "Repository:"
          git rev-parse --show-toplevel

          git config user.name "Professor OS"
          git config user.email "professor-os@users.noreply.github.com"

          # Clean transient Professor OS files before Git operations
          git restore teacher_agent.log 2>/dev/null || true
          rm -f .robotics_teacher_runtime.json
          rm -rf .pytest_cache

          find teacher_agent tests \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          # Stage only persistent generated content
          git add preview

          if [ -f .robotics_teacher_progress.json ]; then
            git add .robotics_teacher_progress.json
          fi

          if git diff --cached --quiet; then
            echo "No generated changes to persist."
            exit 0
          fi

          echo "Files being saved:"
          git status --short

          git commit -m "Professor OS: persist nightly lesson state"

          echo "Checking workspace before sync:"
          git status --short

          git pull --rebase origin main
          git push origin HEAD:main
