name: Professor OS Nightly Lecture

on:
  workflow_dispatch:
  schedule:
    # 21:00 IST = 15:30 UTC
    - cron: '30 15 * * *'

permissions:
  contents: write

concurrency:
  group: professor-os-nightly
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      USE_GEMINI_IMAGES: ${{ vars.USE_GEMINI_IMAGES || 'true' }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-lite-image' }}

      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      GITHUB_BRANCH: main

      PUBLIC_LESSON_BASE_URL: ${{ vars.PROFESSOR_OS_PUBLIC_URL }}

      AUTO_PUBLISH: 'true'
      AUTO_SYNC_SOURCE: 'false'
      DASHBOARD_SCHEDULE: 'false'
      AUTO_BOOTSTRAP_GENERATION: 'false'
      ENABLE_MANUAL_RUN: 'false'

      TIMEZONE: Asia/Kolkata
      NIGHTLY_RELEASE_HOUR: '21'
      NIGHTLY_RELEASE_MINUTE: '0'

      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'

      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}

      GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
      GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Professor OS in Python 3.7
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e OPENAI_API_KEY \
            -e OPENAI_MODEL \
            -e GEMINI_API_KEY \
            -e USE_GEMINI_IMAGES \
            -e GEMINI_IMAGE_MODEL \
            -e GITHUB_TOKEN \
            -e GITHUB_OWNER \
            -e GITHUB_REPO \
            -e GITHUB_BRANCH \
            -e PUBLIC_LESSON_BASE_URL \
            -e AUTO_PUBLISH \
            -e AUTO_SYNC_SOURCE \
            -e DASHBOARD_SCHEDULE \
            -e AUTO_BOOTSTRAP_GENERATION \
            -e ENABLE_MANUAL_RUN \
            -e TIMEZONE \
            -e NIGHTLY_RELEASE_HOUR \
            -e NIGHTLY_RELEASE_MINUTE \
            -e MPLBACKEND \
            -e PYTHONUNBUFFERED \
            -e LINKEDIN_ACCESS_TOKEN \
            -e LINKEDIN_AUTHOR_URN \
            -e GOOGLE_CSE_API_KEY \
            -e GOOGLE_CSE_ID \
            -e YOUTUBE_API_KEY \
            python:3.7-slim \
            sh -lc '
              python -m pip install --upgrade "pip<24.1"
              python -m pip install -r requirements.txt

              echo "Running Professor OS tests..."
              python -m pytest -q
              python -m compileall -q teacher_agent tests

              echo "Generating next lesson..."
              python -m teacher_agent.main --once
            '

      - name: Restore workspace ownership
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Persist generated lesson state
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "Repository:"
          git rev-parse --show-toplevel

          git config user.name "Professor OS"
          git config user.email "professor-os@users.noreply.github.com"

          git add preview

          if [ -f .robotics_teacher_progress.json ]; then
            git add .robotics_teacher_progress.json
          fi

          if git diff --cached --quiet; then
            echo "No generated changes to persist."
            exit 0
          fi

          echo "Files being saved:"
          git status --short

          git commit -m "Professor OS: persist nightly lesson state"

          git pull --rebase origin main
          git push origin HEAD:main
